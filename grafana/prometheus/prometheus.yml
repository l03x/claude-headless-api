# Metrics arrive by remote write (Alloy, Tempo's metrics generator); only the stack's own health is scraped.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]
